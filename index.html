<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Nome</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <main class="max-w-md mx-auto mt-16 bg-white p-4 rounded shadow">
    <div>
      <h1 class="text-xl font-semibold">Digite seu nome</h1>
      <p class="text-sm text-gray-500">O nome será validado enquanto você digita.</p>
    </div>

    <div class="mt-4">
      <label for="inputNome" class="block mb-1">Nome</label>
      <input
        type="text"
        id="inputNome"
        placeholder="Digite aqui"
        autocomplete="off"
        class="w-full p-2 border rounded"
      >
      <p id="mensagemFeedback" class="mt-2 text-sm hidden"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
